<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f7" />
  <title>Orbit – Sign in</title>
  <!-- Satoshi font (fallback to Inter if unavailable) -->
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi" />
  <!-- Phosphor icons -->
  <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@1.4.3/dist/phosphor.css" />
  <link rel="stylesheet" href="./root.css" />
</head>
<body>
  <main id="app">
    <section id="login-view" class="login-view">
      <div class="login-card">
        <h1>Orbit</h1>
        <p>Private Matrix messaging.</p>
        <form id="login-form" autocomplete="on">
          <label>
            <span>Homeserver</span>
            <div style="display:flex;gap:.5rem;align-items:center">
              <select id="homeserver-select" aria-label="Choose homeserver">
                <option value="https://matrix.org">matrix.org</option>
                <option value="https://modular.im">modular.im</option>
                <option value="https://libera.chat">libera.chat</option>
                <option value="custom">Custom…</option>
              </select>
              <input id="homeserver-custom" type="url" placeholder="https://example.org" style="display:none;flex:1" />
            </div>
            <div style="margin-top:.5rem;display:flex;align-items:center;gap:.5rem">
              <input id="remember-homeserver" type="checkbox" />
              <label for="remember-homeserver" style="font-size:.85rem">Remember this homeserver</label>
            </div>
          </label>

          <label>
            <span>Matrix ID</span>
            <input id="login-user" type="text" autocomplete="username" placeholder="@username:matrix.org" required />
          </label>
          <label>
            <span>Password</span>
            <input id="login-password" type="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="error hidden"></p>
          <button id="login-button" class="btn primary" type="submit">Sign in</button>
        </form>
      </div>
    </section>
  </main>
  <script src="./index.js" defer></script>
</body>
</html>
