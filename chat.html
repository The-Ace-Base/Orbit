<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f7" />
  <title>Orbit</title>
  <link rel="stylesheet" href="./root.css" />
</head>
<body>
  <main id="app">
    <section id="main-view">
      <aside id="sidebar">
        <header class="sidebar-header">
          <button id="profile-btn" class="icon-btn" type="button" aria-label="Profile">◯</button>
          <div class="sidebar-title"><strong>Orbit</strong></div>
          <button id="new-dm-btn" class="icon-btn" type="button" aria-label="New direct message">+</button>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">◐</button>
        </header>
        <div class="search-wrap">
          <input id="room-search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
        </div>
        <nav>
          <ul id="room-list" class="room-list" role="list"></ul>
        </nav>
      </aside>

      <section id="chat-panel">
        <div id="empty-state" class="empty-state">
          <p>Select a conversation</p>
        </div>

        <section id="chat-view" class="hidden">
          <header class="chat-header">
            <button id="back-btn" class="icon-btn mobile-only" type="button" aria-label="Back">←</button>
            <img id="chat-avatar" class="avatar" alt="" />
            <div class="room-meta">
              <h2 id="chat-name">Conversation</h2>
              <span id="chat-status" class="muted"></span>
            </div>
            <button id="chat-menu" class="icon-btn" type="button" aria-label="Conversation menu">⋯</button>
          </header>

          <div id="message-list" class="message-list" aria-live="polite"></div>
          <div id="typing-indicator" class="typing hidden"></div>

          <form id="composer" class="composer">
            <input id="message-input" type="text" placeholder="Message" autocomplete="off" maxlength="10000" />
            <button class="btn primary" type="submit" aria-label="Send message">Send</button>
          </form>
        </section>
      </section>
    </section>

    <!-- DM Modal -->
    <div id="dm-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal">
        <header class="modal-header">
          <h3>New conversation</h3>
          <button id="close-dm" class="icon-btn" type="button" aria-label="Close">×</button>
        </header>
        <div class="modal-body">
          <label>
            <span>Username or Matrix ID</span>
            <input id="dm-user" type="text" placeholder="@username:example.org" autocomplete="off" spellcheck="false" />
          </label>
          <div id="dm-results" style="max-height:150px; overflow-y:auto; margin:.5rem 0;"></div>
          <p id="dm-error" class="error hidden"></p>
          <div class="actions">
            <button id="cancel-dm" class="btn" type="button">Cancel</button>
            <button id="start-dm" class="btn primary" type="button">Start chat</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./chat.js" defer></script>
</body>
</html>
