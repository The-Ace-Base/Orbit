<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0b0b">

  <title>Orbit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Satoshi:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./root.css">
</head>

<body class="chat-page">

  <div class="app-shell">

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="Rooms"
    >
      <header class="sidebar-header">

        <div class="brand-lockup compact">
          <span class="brand-mark">◌</span>

          <div>
            <p class="eyebrow">ORBIT</p>
            <strong id="sidebar-user">Matrix</strong>
          </div>
        </div>

        <div class="header-actions">
          <button
            id="theme-toggle"
            class="icon-button"
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            ◐
          </button>

          <button
            id="profile-btn"
            class="avatar-button"
            type="button"
            aria-label="Profile"
          >
            <span id="profile-avatar">?</span>
          </button>
        </div>
      </header>

      <div class="sidebar-tools">

        <label class="search-box">
          <span aria-hidden="true">⌕</span>

          <input
            id="room-search"
            type="search"
            placeholder="Search rooms"
            autocomplete="off"
            spellcheck="false"
          >
        </label>

        <button
          id="new-dm-btn"
          class="new-button"
          type="button"
        >
          <span>＋</span>
          <span>New conversation</span>
        </button>
      </div>

      <div
        id="room-list"
        class="room-list"
        role="list"
      ></div>

      <footer class="sidebar-footer">
        <span id="connection-status">Connecting</span>
        <span class="status-dot" aria-hidden="true"></span>
      </footer>
    </aside>

    <main class="chat-main">

      <header class="chat-header">

        <button
          id="back-btn"
          class="icon-button mobile-only"
          type="button"
          aria-label="Back to rooms"
        >
          ‹
        </button>

        <button
          id="chat-avatar-button"
          class="chat-avatar-button"
          type="button"
          aria-label="Room information"
        >
          <img
            id="chat-avatar"
            alt=""
            hidden
          >

          <span id="chat-avatar-fallback">◌</span>
        </button>

        <div class="chat-heading">
          <strong id="chat-name">Orbit</strong>
          <span id="chat-status">Select a conversation</span>
        </div>

        <div class="chat-actions">

          <button
            id="search-chat-btn"
            class="icon-button"
            type="button"
            aria-label="Search conversation"
          >
            ⌕
          </button>

          <button
            id="chat-menu"
            class="icon-button"
            type="button"
            aria-label="Conversation menu"
          >
            ···
          </button>
        </div>
      </header>

      <section
        id="empty-state"
        class="empty-state"
      >
        <div class="empty-orbit">◌</div>

        <h1>Orbit</h1>

        <p>
          Select a conversation and start moving.
        </p>
      </section>

      <section
        id="chat-view"
        class="chat-view hidden"
      >

        <div
          id="message-list"
          class="message-list"
          role="log"
          aria-live="polite"
          aria-relevant="additions"
        ></div>

        <div
          id="typing-indicator"
          class="typing-indicator"
          aria-live="polite"
        ></div>

        <div
          id="reply-preview"
          class="reply-preview hidden"
        >
          <div>
            <span>Replying to</span>
            <strong id="reply-author"></strong>
            <p id="reply-body"></p>
          </div>

          <button
            id="cancel-reply"
            type="button"
            class="icon-button"
            aria-label="Cancel reply"
          >
            ×
          </button>
        </div>

        <form
          id="composer"
          class="composer"
        >
          <div class="composer-shell">

            <button
              id="emoji-button"
              class="composer-button"
              type="button"
              aria-label="Emoji"
              aria-expanded="false"
            >
              ☺
            </button>

            <input
              id="file-input"
              type="file"
              hidden
              multiple
            >

            <button
              id="attach-button"
              class="composer-button"
              type="button"
              aria-label="Attach file"
            >
              ＋
            </button>

            <textarea
              id="message-input"
              rows="1"
              maxlength="65536"
              placeholder="Write a message…"
              autocomplete="off"
              spellcheck="true"
            ></textarea>

            <button
              id="send-button"
              class="send-button"
              type="submit"
              aria-label="Send message"
            >
              ↑
            </button>
          </div>

          <div
            id="emoji-picker"
            class="emoji-picker hidden"
            aria-label="Emoji picker"
          >
            <div class="emoji-search-row">
              <input
                id="emoji-search"
                type="search"
                placeholder="Search emoji"
                autocomplete="off"
              >
            </div>

            <nav
              id="emoji-categories"
              class="emoji-categories"
              aria-label="Emoji categories"
            ></nav>

            <div
              id="emoji-grid"
              class="emoji-grid"
            ></div>
          </div>
        </form>
      </section>
    </main>
  </div>

  <dialog id="dm-modal" class="modal">
    <form
      id="dm-form"
      class="modal-card"
      method="dialog"
    >
      <header class="modal-header">
        <div>
          <p class="eyebrow">NEW</p>
          <h2>Conversation</h2>
        </div>

        <button
          id="close-dm"
          type="button"
          class="icon-button"
        >
          ×
        </button>
      </header>

      <label class="field">
        <span>Matrix ID</span>

        <input
          id="dm-user"
          type="text"
          placeholder="@user:example.org"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        >
      </label>

      <div
        id="dm-results"
        class="dm-results"
      ></div>

      <p
        id="dm-error"
        class="form-error"
        role="alert"
      ></p>

      <div class="modal-actions">
        <button
          id="cancel-dm"
          type="button"
          class="secondary-button"
        >
          Cancel
        </button>

        <button
          id="start-dm"
          class="primary-button"
          type="submit"
        >
          Start
        </button>
      </div>
    </form>
  </dialog>

  <dialog id="profile-modal" class="modal">
    <form
      id="profile-form"
      class="modal-card"
      method="dialog"
    >
      <header class="modal-header">
        <div>
          <p class="eyebrow">ACCOUNT</p>
          <h2>Profile</h2>
        </div>

        <button
          id="close-profile"
          type="button"
          class="icon-button"
        >
          ×
        </button>
      </header>

      <label class="field">
        <span>Display name</span>

        <input
          id="profile-name"
          type="text"
          maxlength="255"
          autocomplete="name"
        >
      </label>

      <p
        id="profile-error"
        class="form-error"
        role="alert"
      ></p>

      <div class="modal-actions">
        <button
          id="logout-btn"
          type="button"
          class="danger-button"
        >
          Sign out
        </button>

        <button
          class="primary-button"
          type="submit"
        >
          Save
        </button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./chat.js"></script>
</body>
</html>
